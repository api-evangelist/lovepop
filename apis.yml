aid: lovepop
name: Lovepop
description: >-
  Lovepop is a Boston-based consumer greeting-card and gifting company, founded
  in 2014 and known for its intricate laser-cut 3D pop-up cards inspired by
  Vietnamese "kirigami" paper engineering. The company sells directly to
  consumers through its Shopify-powered storefront at lovepop.com and through
  retail partners, offering pop-up greeting cards, gift boxes, flowers, and
  personalized gifting. Lovepop was accelerated by Techstars and appeared on
  ABC's Shark Tank. It is tracked in the API Evangelist network as a Techstars
  portfolio company; as of this pass Lovepop publishes no first-party developer
  API, SDKs, or developer portal, and its public digital surface is a standard
  Shopify commerce storefront (including Shopify Customer Account OIDC/OAuth
  well-known documents served on the domain).
